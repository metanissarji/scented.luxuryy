<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1C0409">
<title>Scented Luxury — בשמי יוקרה ונישה</title>
<meta name="description" content="Scented Luxury by Mustafa — בשמי יוקרה ונישה מבתי הבושם המובילים בעולם. משלוחים לכל הארץ.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@200;300;400&family=Bellefair&family=Heebo:wght@300;400&family=Marcellus&display=swap" rel="stylesheet">
<style>
:root{
  /* sampled from the Instagram logo */
  --oxblood:#330A12;
  --velvet:#1C0409;
  --wine:#4A1320;
  --rose:#D9B2A2;
  --champagne:#F2DCCF;
  --dust:#A8837A;
  --line:rgba(217,178,162,.18);
  --line-strong:rgba(217,178,162,.42);
  --rosegold:linear-gradient(180deg,#FBEBE1 0%,#E6C3B2 45%,#C0907E 78%,#E9CBBB 100%);
  --lat:"Marcellus","Times New Roman",serif;
  --wrap:1200px;
  --gutter:16px;
  --nav:60px;
  --ease:cubic-bezier(.2,.8,.2,1);
}
html[lang="he"]{--display:"Bellefair",serif;--display-w:400;--body:"Heebo",system-ui,sans-serif;--h1-lh:1.08}
html[lang="ar"]{--display:"Alexandria",system-ui,sans-serif;--display-w:200;--body:"Alexandria",system-ui,sans-serif;--h1-lh:1.3}
@media (min-width:760px){:root{--gutter:32px;--nav:72px}}
*{box-sizing:border-box}
/* fallback when WebGL is unavailable; the satin canvas paints over it */
html{background:radial-gradient(ellipse 120% 70% at 50% 30%,#4A1320,var(--oxblood) 45%,var(--velvet)) fixed var(--velvet);-webkit-text-size-adjust:100%;scroll-padding-top:calc(var(--nav) + 16px)}
body{margin:0;color:var(--champagne);font-family:var(--body);font-weight:300;font-size:15px;line-height:1.75;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
@media (min-width:760px){body{font-size:16px}}
body.locked{overflow:hidden}
img,svg{display:block}
img{max-width:100%}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--champagne);outline-offset:3px;border-radius:6px}
.wrap{max-width:var(--wrap);margin-inline:auto;padding-inline:var(--gutter)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.lat{font-family:var(--lat);letter-spacing:.24em;text-transform:uppercase}
.gold-text{background:var(--rosegold);-webkit-background-clip:text;background-clip:text;color:transparent}
.display{font-family:var(--display);font-weight:var(--display-w)}

/* ---------- satin background (WebGL) ---------- */
#silk{position:fixed;top:0;left:0;width:100vw;height:100vh;height:100lvh;z-index:-1;display:block;opacity:0;transition:opacity 1.2s ease}
#silk.ready{opacity:1}

/* ---------- nav ---------- */
.nav{position:fixed;inset:0 0 auto;z-index:50;height:var(--nav);transition:background .4s,border-color .4s;border-bottom:1px solid transparent}
.nav.scrolled{background:rgba(28,4,9,.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom-color:var(--line)}
.nav-in{display:flex;align-items:center;justify-content:space-between;height:100%;gap:12px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;opacity:0;transform:translateY(-6px);pointer-events:none;transition:opacity .5s,transform .5s}
.nav.show-brand .brand{opacity:1;transform:none;pointer-events:auto}
.brand svg{width:20px;height:30px}
.brand-word{display:flex;flex-direction:column;line-height:1;direction:ltr;text-align:center}
.brand-word b{font-family:var(--lat);font-weight:400;font-size:15px;letter-spacing:.2em}
.brand-word small{font-family:var(--lat);font-size:8px;letter-spacing:.42em;color:var(--dust);margin-top:5px}
@media (min-width:760px){.brand-word b{font-size:19px}.brand-word small{font-size:9px}.brand svg{width:24px;height:36px}}
.nav-links{display:none;gap:30px;list-style:none;margin:0;padding:0}
.nav-links a{text-decoration:none;font-size:14px;color:var(--rose);transition:color .3s}
.nav-links a:hover{color:var(--champagne)}
@media (min-width:900px){.nav-links{display:flex}}
.nav-tools{display:flex;align-items:center;gap:8px}
.lang-btn{height:40px;padding:0 14px;border:1px solid var(--line-strong);border-radius:999px;font-size:13.5px;color:var(--champagne);background:rgba(28,4,9,.35);transition:border-color .3s,background .3s}
.lang-btn:lang(ar){font-family:"Alexandria",sans-serif}
.lang-btn:lang(he){font-family:"Heebo",sans-serif}
.lang-btn:hover{border-color:var(--rose);background:rgba(217,178,162,.08)}
.bag-btn{position:relative;width:44px;height:44px;display:grid;place-items:center;border:1px solid var(--line-strong);border-radius:50%;background:rgba(28,4,9,.35);transition:border-color .3s,background .3s}
.bag-btn:hover{border-color:var(--rose);background:rgba(217,178,162,.08)}
.bag-btn svg{width:19px;height:19px;stroke:var(--champagne);fill:none;stroke-width:1.3}
.bag-count{position:absolute;top:-3px;left:-3px;min-width:19px;height:19px;padding:0 5px;border-radius:999px;background:var(--rose);color:var(--oxblood);font-size:11px;font-weight:400;display:grid;place-items:center;transform:scale(0);transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.bag-count.has{transform:scale(1)}
.bag-count.bump{transform:scale(1.3)}

/* ---------- hero ---------- */
.hero{position:relative;min-height:100svh;display:flex;align-items:center;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 80% 38% at 50% 26%,rgba(20,3,8,.55),transparent 70%);pointer-events:none}
.hero-in{position:relative;z-index:2;width:100%;display:grid;justify-items:center;text-align:center;
  grid-template-areas:"logo" "copy" "cta";padding-block:calc(var(--nav) + 10px) 28px}
.hero-copy{grid-area:copy}
.hero-logo{grid-area:logo;position:relative;width:min(80vw,340px);margin:0 auto 22px}
.hero-logo::before{content:"";position:absolute;inset:-20% -14%;background:radial-gradient(closest-side,rgba(226,170,150,.2),transparent 72%);pointer-events:none}
.logo{position:relative;width:100%;height:auto;overflow:visible;filter:drop-shadow(0 14px 30px rgba(0,0,0,.6))}
.logo-in{animation:logoIn 1.8s var(--ease) both}
@keyframes logoIn{from{opacity:0;transform:scale(.95)}}
.hero-cta{grid-area:cta;display:flex;flex-direction:column;align-items:center;gap:14px;width:100%}
.eyebrow{display:inline-flex;align-items:center;gap:12px;font-size:10.5px;color:var(--dust);margin:0 0 10px}
.eyebrow::before,.eyebrow::after{content:"";width:22px;height:1px;background:var(--dust);opacity:.7}
.hero h1{margin:0;font-size:clamp(38px,11.5vw,52px);line-height:var(--h1-lh);letter-spacing:-.005em}
html[lang="ar"] .hero h1{font-size:clamp(33px,10vw,46px)}
.h1-line{display:inline}
.tagline{font-size:10px;color:var(--rose);margin:12px 0 0;direction:ltr;letter-spacing:.3em}
.trust{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--rose);margin:0}
.trust svg{width:16px;height:16px;stroke:var(--rose);fill:none;stroke-width:1.3;flex:none}
.hero-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:420px}
.fade-in{opacity:0;animation:fadeIn .6s ease forwards}
@keyframes fadeIn{to{opacity:1}}

@media (min-width:900px){
  .hero-in{grid-template-columns:1.1fr .9fr;grid-template-areas:"copy logo" "cta logo";justify-items:start;text-align:start;align-items:center;column-gap:48px;padding-block:120px 70px}
  .hero::before{background:radial-gradient(ellipse 50% 50% at 70% 45%,rgba(20,3,8,.5),transparent 70%)}
  .hero-copy{align-self:end}
  .hero-cta{align-self:start;align-items:flex-start;margin-top:30px}
  .eyebrow::after{display:none}
  .h1-line{display:block}
  .hero h1{font-size:clamp(78px,8.4vw,124px)}
  html[lang="ar"] .hero h1{font-size:clamp(72px,8vw,118px);line-height:1.28}
  .tagline{font-size:12px}
  .hero-logo{justify-self:center;width:min(38vw,500px);margin:0}
  .hero-actions{display:flex;width:auto}
}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:50px;border-radius:999px;padding:12px 24px;font-size:15px;font-weight:400;text-decoration:none;border:1px solid transparent;transition:transform .25s,background .3s,box-shadow .3s,border-color .3s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn-gold{background:var(--rosegold);color:var(--oxblood);box-shadow:0 10px 30px -14px rgba(230,195,178,.6)}
.btn-ghost{border-color:var(--line-strong);color:var(--champagne);background:rgba(28,4,9,.35)}
.btn-ghost:hover{border-color:var(--rose);background:rgba(217,178,162,.08)}
.btn svg{width:18px;height:18px;fill:currentColor}

/* ---------- marquee ---------- */
.houses{border-block:1px solid var(--line);background:rgba(28,4,9,.55);padding:16px 0;overflow:hidden}
.track{display:flex;width:max-content;animation:marq 40s linear infinite}
.track span{font-family:var(--lat);font-size:15px;letter-spacing:.2em;color:var(--rose);white-space:nowrap;padding-inline:22px;display:flex;align-items:center;gap:44px;text-transform:uppercase}
.track span::after{content:"✦";font-size:9px;color:var(--dust)}
@media (min-width:760px){.track span{font-size:20px}}
@keyframes marq{to{transform:translateX(-50%)}}

/* ---------- sections ---------- */
.section{padding-block:64px}
@media (min-width:760px){.section{padding-block:110px}}
.sec-head{margin-bottom:24px}
.sec-head .eyebrow::after{display:none}
.sec-title{font-size:clamp(38px,10vw,64px);line-height:1.15;margin:0 0 8px}
html[lang="ar"] .sec-title{font-size:clamp(34px,9vw,58px);line-height:1.2}
.sec-sub{color:var(--rose);margin:0;max-width:52ch;font-size:14.5px}
@media (min-width:760px){.sec-sub{font-size:16px}}

/* ---------- mood filter (Instagram-highlight style) ---------- */
@property --a{syntax:'<angle>';inherits:false;initial-value:0deg}
.moods{display:flex;justify-content:center;gap:clamp(12px,4.5vw,40px);margin:6px 0 30px}
.mood{display:flex;flex-direction:column;align-items:center;gap:8px;width:70px}
.mood-ring{width:68px;height:68px;border-radius:50%;padding:2.5px;background:var(--line-strong);transition:transform .45s var(--ease)}
.mood-ring img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:2.5px solid var(--velvet);filter:saturate(.55) brightness(.7);transition:filter .45s}
.mood[aria-pressed="true"] .mood-ring{background:conic-gradient(from var(--a),#FBEBE1,#C0907E,#E9CBBB,#8E5A4A,#FBEBE1);transform:scale(1.07);animation:ring 1.1s var(--ease)}
.mood[aria-pressed="true"] .mood-ring img{filter:none}
@keyframes ring{from{--a:-200deg}}
.mood-name{font-size:13px;color:var(--rose);line-height:1.25;text-align:center}
.mood-name small{display:block;font-size:10.5px;color:var(--dust);margin-top:1px}
.mood[aria-pressed="true"] .mood-name{color:var(--champagne)}
@media (hover:hover){.mood:hover .mood-ring img{filter:none}}
@media (min-width:760px){.moods{margin-bottom:44px}.mood{width:100px}.mood-ring{width:90px;height:90px}.mood-name{font-size:14.5px}}

/* ---------- product grid ---------- */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:26px 12px}
@media (min-width:760px){.grid{grid-template-columns:repeat(3,1fr);gap:40px 24px}}
@media (min-width:1100px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{display:flex;flex-direction:column;min-width:0}
.card[hidden]{display:none}
.card-open{display:flex;flex-direction:column;text-align:start;width:100%}
.ph{position:relative;display:block;aspect-ratio:3/4;border-radius:999px 999px 14px 14px;overflow:hidden;background:var(--wine);box-shadow:0 18px 36px -18px rgba(0,0,0,.8)}
.ph::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 1px rgba(242,220,207,.16);pointer-events:none}
.ph img{width:100%;height:100%;object-fit:cover;transform:scale(1.08);opacity:0;transition:transform 1.4s var(--ease),opacity 1s ease}
.card.in .ph img{transform:none;opacity:1}
@media (hover:hover){.card-open:hover .ph img{transform:scale(1.04)}}
.house{display:block;font-size:9.5px;color:var(--dust);margin:12px 0 2px;letter-spacing:.18em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:ltr;text-align:right}
.name{display:block;font-family:var(--lat);font-size:17px;line-height:1.3;color:var(--champagne);direction:ltr;text-align:right}
.vibe{display:block;font-size:12px;color:var(--rose);margin-top:3px;line-height:1.5}
.card-foot{display:flex;align-items:center;justify-content:space-between;margin-top:10px}
.price{font-family:var(--lat);font-size:16px;color:var(--champagne);direction:ltr}
.add{width:40px;height:40px;border-radius:50%;border:1px solid var(--line-strong);background:rgba(28,4,9,.35);display:grid;place-items:center;transition:background .3s,border-color .3s,transform .2s}
.add svg{width:16px;height:16px;stroke:var(--champagne);stroke-width:1.4;fill:none}
.add:active{transform:scale(.9)}
@media (hover:hover){.add:hover{background:var(--rose);border-color:var(--rose)}.add:hover svg{stroke:var(--oxblood)}}
@media (min-width:760px){.house{font-size:10.5px}.name{font-size:20px}.vibe{font-size:13px}.price{font-size:18px}}

/* wax seal */
.seal-drop{position:absolute;top:50%;left:50%;width:46%;max-width:120px;z-index:4;pointer-events:none;transform:translate(-50%,-50%);animation:stamp 1.9s var(--ease) forwards}
.seal-drop svg{width:100%;height:auto;filter:drop-shadow(0 10px 16px rgba(0,0,0,.55))}
@keyframes stamp{0%{opacity:0;transform:translate(-50%,-50%) scale(2.2) rotate(-20deg)}22%{opacity:1;transform:translate(-50%,-50%) scale(.92) rotate(3deg)}32%,78%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(1)}}

/* ---------- ritual ---------- */
.rail{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding-inline:var(--gutter);margin-inline:calc(var(--gutter) * -1);padding-bottom:6px}
.rail::-webkit-scrollbar{display:none}
.rail figure{flex:none;width:76%;margin:0;scroll-snap-align:center}
.rail .ph{border-radius:18px}
.rail .ph img{opacity:1;transform:none}
.rail figcaption{padding:14px 2px 0}
.rail h3{font-family:var(--display);font-weight:var(--display-w);font-size:22px;margin:0 0 2px;color:var(--champagne)}
html[lang="ar"] .rail h3{font-weight:300;font-size:19px}
.rail p{margin:0;font-size:13.5px;color:var(--rose)}
@media (min-width:760px){.rail{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;overflow:visible;margin:0;padding:0}.rail figure{width:auto}.rail h3{font-size:26px}.rail p{font-size:15px}}
.ship-line{display:flex;align-items:center;justify-content:center;gap:10px;margin:34px 0 0;padding:16px;border:1px solid var(--line);border-radius:14px;background:rgba(28,4,9,.4);font-size:14px;color:var(--rose);text-align:center}
.ship-line svg{width:22px;height:22px;stroke:var(--rose);fill:none;stroke-width:1.2;flex:none}

/* ---------- footer ---------- */
.footer{position:relative;overflow:hidden;background:rgba(28,4,9,.7);border-top:1px solid var(--line);text-align:center;padding:80px 0 calc(28px + env(safe-area-inset-bottom))}
.footer::before{content:"";position:absolute;inset:0;background:url(img/brandcard.webp) center/cover;opacity:.22}
.footer::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(28,4,9,.9) 0%,rgba(28,4,9,.45) 40%,var(--velvet) 100%)}
.footer .wrap{position:relative;z-index:1}
.foot-line{font-family:var(--lat);font-size:clamp(24px,7vw,54px);letter-spacing:.1em;line-height:1.35;margin:0 0 10px;direction:ltr}
.foot-sub{color:var(--rose);margin:0 0 28px;font-size:14px}
.foot-actions{display:grid;gap:10px;max-width:360px;margin:0 auto 56px}
@media (min-width:760px){.foot-actions{display:flex;justify-content:center;max-width:none}}
.foot-meta{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:22px;font-size:12px;color:var(--dust)}
@media (min-width:760px){.foot-meta{flex-direction:row;justify-content:space-between}}
@media (max-width:899px){body.has-bag .footer{padding-bottom:calc(96px + env(safe-area-inset-bottom))}}

/* ---------- product sheet ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,1,4,.5);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:60;opacity:0;pointer-events:none;transition:opacity .4s}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;inset:auto 0 0 0;z-index:61;max-height:92svh;display:flex;flex-direction:column;background:linear-gradient(180deg,#3B0E17,var(--velvet) 40%);border-radius:24px 24px 0 0;border-top:1px solid var(--line-strong);transform:translateY(105%);transition:transform .5s var(--ease),visibility 0s .5s;visibility:hidden}
.sheet.open{transform:none;visibility:visible;transition:transform .5s var(--ease)}
.sheet.dragging{transition:none}
.grip{flex:none;display:grid;place-items:center;height:26px;cursor:grab;touch-action:none}
.grip span{width:42px;height:4px;border-radius:4px;background:var(--line-strong)}
.sheet-x{position:absolute;top:10px;left:12px;z-index:2;width:40px;height:40px;border-radius:50%;background:rgba(28,4,9,.6);border:1px solid var(--line);font-size:22px;line-height:1;color:var(--rose);display:grid;place-items:center}
.sheet-body{overflow-y:auto;overscroll-behavior:contain;padding:0 var(--gutter) 20px}
.sh-media{position:relative;width:min(62vw,300px);aspect-ratio:3/4;margin:0 auto 18px;border-radius:999px 999px 16px 16px;overflow:hidden;box-shadow:0 24px 48px -24px rgba(0,0,0,.8)}
.sh-media img{width:100%;height:100%;object-fit:cover}
.sheet.open .sh-media img{animation:settle 1.1s var(--ease)}
@keyframes settle{from{transform:scale(1.1);opacity:.4}}
.sh-house{font-size:10px;color:var(--dust);margin:0;text-align:center;direction:ltr}
.sh-name{font-family:var(--lat);font-weight:400;font-size:30px;line-height:1.2;margin:4px 0 4px;text-align:center;direction:ltr}
.sh-meta{margin:0;text-align:center;font-size:13px;color:var(--rose)}
.sh-desc{margin:16px 0 0;font-size:14.5px;color:var(--champagne);opacity:.92}
.sheet-bar{flex:none;display:flex;gap:10px;padding:12px var(--gutter) calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:rgba(28,4,9,.94)}
.sheet-bar .btn-gold{flex:1}
.wa-btn{flex:none;width:50px;height:50px;border-radius:50%;border:1px solid var(--line-strong);display:grid;place-items:center}
.wa-btn svg{width:22px;height:22px;fill:var(--champagne)}
@media (min-width:900px){
  .sheet{inset:50% auto auto 50%;width:min(940px,92vw);max-height:88vh;border-radius:24px;border:1px solid var(--line-strong);transform:translate(-50%,-46%) scale(.97);opacity:0;transition:transform .45s var(--ease),opacity .35s,visibility 0s .45s}
  .sheet.open{transform:translate(-50%,-50%);opacity:1;transition:transform .45s var(--ease),opacity .35s}
  .grip{display:none}
  .sheet-body{display:grid;grid-template-columns:.85fr 1.15fr;gap:40px;padding:36px 36px 24px}
  .sh-media{width:100%;margin:0;align-self:start;position:sticky;top:0}
  .sh-house,.sh-name,.sh-meta{text-align:start}
  .sh-name{font-size:38px}
  .sheet-bar{padding:14px 36px;border-radius:0 0 24px 24px}
  .sheet-x{left:auto;right:16px;top:16px}
}

/* dry-down inside sheet */
.dd{margin-top:22px;border:1px solid var(--line);border-radius:18px;padding:16px;background:rgba(51,10,18,.45)}
.dd-head{display:flex;align-items:center;gap:14px;margin-bottom:10px}
.dd-aura{flex:none;width:64px;height:64px}
.dd-title{margin:0;font-weight:400;font-size:15px;color:var(--champagne)}
.dd-time{display:block;font-size:13px;color:var(--rose)}
.dd-time b{font-family:var(--lat);font-weight:400;font-size:22px;color:var(--champagne);margin-inline-end:6px}
input[type=range]{width:100%;-webkit-appearance:none;appearance:none;height:34px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:linear-gradient(to left,var(--rose) var(--fill,0%),var(--line) var(--fill,0%))}
input[type=range]::-moz-range-track{height:2px;background:var(--line)}
input[type=range]::-moz-range-progress{height:2px;background:var(--rose)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;margin-top:-11px;border-radius:50%;background:var(--rosegold);border:3px solid var(--velvet);box-shadow:0 0 0 1px var(--rose),0 0 16px rgba(242,220,207,.45)}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#E6C3B2;border:3px solid var(--velvet);box-shadow:0 0 0 1px var(--rose)}
.dd-marks{display:flex;justify-content:space-between;font-size:11px;color:var(--dust);margin:-2px 0 12px}
.dd-rows{display:grid;gap:12px}
.dd-row{transition:opacity .3s}
.dd-row-head{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px}
.dd-row-head b{font-weight:400;color:var(--champagne)}
.dd-row-head span{color:var(--rose)}
.meter{height:3px;border-radius:3px;background:var(--line);overflow:hidden;margin:5px 0 7px}
.meter i{display:block;height:100%;width:0;background:var(--c,var(--rose));transition:width .2s linear}
.notes{display:flex;flex-wrap:wrap;gap:5px}
.notes span{font-size:12px;padding:2px 10px;border-radius:999px;border:1px solid var(--line);color:var(--champagne)}
.dd-foot{margin:12px 0 0;font-size:11px;color:var(--dust)}

/* ---------- bag ---------- */
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(420px,100%);z-index:62;background:var(--velvet);border-inline-start:1px solid var(--line);transform:translateX(-102%);transition:transform .5s var(--ease),visibility 0s .5s;display:flex;flex-direction:column;visibility:hidden}
.drawer.open{transform:none;visibility:visible;transition:transform .5s var(--ease)}
.drawer-head{display:flex;justify-content:space-between;align-items:center;padding:14px var(--gutter);border-bottom:1px solid var(--line);min-height:var(--nav)}
.drawer-head h2{font-family:var(--display);font-weight:var(--display-w);font-size:28px;margin:0}
.x{width:44px;height:44px;border-radius:50%;font-size:24px;line-height:1;color:var(--rose);display:grid;place-items:center}
.x:hover{background:rgba(217,178,162,.08)}
.bag-items{flex:1;overflow:auto;padding:4px var(--gutter);list-style:none;margin:0}
.bag-item{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.bag-item img{width:56px;height:70px;object-fit:cover;border-radius:999px 999px 8px 8px}
.bi-name{font-family:var(--lat);font-size:15px;color:var(--champagne);line-height:1.3;direction:ltr;text-align:right}
.bi-meta{font-size:12px;color:var(--dust)}
.qty{display:flex;align-items:center;gap:10px;margin-top:6px}
.qty button{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);font-size:16px;line-height:1;color:var(--rose)}
.qty span{font-family:var(--lat);min-width:14px;text-align:center}
.bi-price{font-family:var(--lat);direction:ltr}
.bag-empty{padding:56px 8px;text-align:center;color:var(--rose)}
.bag-empty p{margin:0 0 18px}
.drawer-foot{padding:16px var(--gutter) calc(18px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.total-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
.total-row b{font-family:var(--lat);font-weight:400;font-size:26px;direction:ltr}
.ship-note{font-size:12.5px;color:var(--dust);margin:0 0 14px}
.drawer-foot .btn{width:100%}

.bag-pill{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom));left:0;right:0;margin-inline:auto;width:max-content;max-width:calc(100% - 32px);z-index:40;display:flex;align-items:center;gap:12px;min-height:52px;padding:0 22px;border-radius:999px;background:var(--rosegold);color:var(--oxblood);font-size:14.5px;font-weight:400;box-shadow:0 14px 34px -10px rgba(0,0,0,.7);transform:translateY(160%);transition:transform .5s cubic-bezier(.2,.9,.3,1.2)}
.bag-pill.show{transform:none}
.bag-pill b{font-family:var(--lat);font-weight:400;font-size:16px;direction:ltr}
.bag-pill i{width:1px;height:18px;background:rgba(51,10,18,.3)}
@media (min-width:900px){.bag-pill{display:none}}

.toast{position:fixed;top:calc(var(--nav) + 10px);left:0;right:0;margin-inline:auto;width:max-content;max-width:calc(100% - 32px);z-index:70;transform:translateY(-30px);opacity:0;pointer-events:none;background:var(--champagne);color:var(--oxblood);border-radius:999px;padding:10px 20px;font-size:14px;font-weight:400;box-shadow:0 16px 36px -12px rgba(0,0,0,.6);transition:transform .45s var(--ease),opacity .3s}
.toast.show{transform:none;opacity:1}

.reveal{opacity:0;transform:translateY(22px);transition:opacity .9s ease,transform .9s var(--ease)}
.reveal.in{opacity:1;transform:none}

::view-transition-old(root),::view-transition-new(root){animation-duration:.35s}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .fade-in,.reveal,.ph img{opacity:1!important;transform:none!important}
}
</style>
</head>

/* ================= SATIN BACKGROUND =================
   בד סאטן שזז לאט ומקבל את הצבע של הבושם שעליו גוללים */
const TINTS = {brand:['#E0AE98', 0], ritual:['#C23A48', .75]};
const Silk = (() => {
  const cv = $('#silk');
  const gl = cv.getContext('webgl', {antialias:false, depth:false, stencil:false, alpha:false, powerPreference:'low-power'});
  if (!gl) return {set(){}};
  const vs = 'attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}';
  const fs = `precision mediump float;
uniform vec2 uRes;uniform float uTime;uniform float uScroll;uniform vec3 uA;uniform vec3 uB;uniform float uAmt;
float silk(vec2 p,float t){
  vec2 q=p;
  q.x+=.55*sin(q.y*1.25+t*.19)+.25*sin(q.y*2.8-t*.13);
  q.y+=.35*sin(q.x*1.15-t*.15);
  float f=sin(q.x*2.7+q.y*1.2+t*.09);
  f+=.5*sin(q.x*5.2-q.y*1.9+t*.06+1.3);
  f+=.18*sin(q.x*9.4+q.y*3.3-t*.05);
  return f;
}
float hash(vec2 p){return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453);}
void main(){
  vec2 uv=gl_FragCoord.xy/uRes;
  vec2 p=(gl_FragCoord.xy-.5*uRes)/min(uRes.x,uRes.y)*1.4;
  p.y+=uScroll*.35;
  float t=uTime,e=.01;
  float h=silk(p,t);
  vec2 g=vec2(silk(p+vec2(e,0.),t)-h,silk(p+vec2(0.,e),t)-h)/e;
  vec3 n=normalize(vec3(-g*.30,1.));
  vec3 L=normalize(vec3(-.5,.6,.62));
  float diff=clamp(dot(n,L),0.,1.);
  float spec=pow(clamp(dot(n,normalize(L+vec3(0.,0.,1.))),0.,1.),16.);
  float sheen=pow(1.-n.z,1.2);
  vec3 tint=mix(uA,uB,smoothstep(.15,.85,uv.x));
  vec3 base=mix(vec3(.2,.035,.07),tint*.42,.3*uAmt);
  vec3 col=base*(.25+1.0*diff*diff)+tint*(.32*spec+.14*sheen);
  float v=smoothstep(1.35,.2,length((uv-.5)*vec2(1.,1.1)));
  col*=.58+.42*v;
  col+=(hash(gl_FragCoord.xy)-.5)*.016;
  gl_FragColor=vec4(col,1.);
}`;
  const sh = (type, src) => { const o = gl.createShader(type); gl.shaderSource(o, src); gl.compileShader(o); return gl.getShaderParameter(o, gl.COMPILE_STATUS) ? o : null; };
  const v = sh(gl.VERTEX_SHADER, vs), f = sh(gl.FRAGMENT_SHADER, fs);
  if (!v || !f) return {set(){}};
  const pr = gl.createProgram(); gl.attachShader(pr, v); gl.attachShader(pr, f); gl.linkProgram(pr);
  if (!gl.getProgramParameter(pr, gl.LINK_STATUS)) return {set(){}};
  gl.useProgram(pr);
  const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,3,-1,-1,3]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(pr, 'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  const U = n => gl.getUniformLocation(pr, n);
  const uRes = U('uRes'), uTime = U('uTime'), uScroll = U('uScroll'), uA = U('uA'), uB = U('uB'), uAmt = U('uAmt');
  const rgb = h => [1,3,5].map(i => parseInt(h.slice(i, i + 2), 16) / 255);
  const cur = {a:rgb(TINTS.brand[0]), b:rgb(TINTS.brand[0]), amt:0}, tgt = {a:cur.a.slice(), b:cur.b.slice(), amt:0};
  let w = 0, hgt = 0, raf = 0, last = 0;
  const t0 = performance.now(), frozen = reduceMotion ? 8 : null;
  function size(){
    const s = innerWidth < 760 ? .5 : .38;
    const nw = Math.round(cv.clientWidth * s), nh = Math.round(cv.clientHeight * s);
    if (nw === w && Math.abs(nh - hgt) < 4) return;
    w = cv.width = nw; hgt = cv.height = nh; gl.viewport(0, 0, w, hgt); gl.uniform2f(uRes, w, hgt);
  }
  function frame(now){
    raf = 0;
    if (document.hidden) return;
    const settling = Math.abs(cur.amt - tgt.amt) > .002 || cur.a.some((x, i) => Math.abs(x - tgt.a[i]) > .002) || cur.b.some((x, i) => Math.abs(x - tgt.b[i]) > .002);
    if (now - last >= 33){
      const k = last ? Math.min(1, (now - last) / 1000 * 2.6) : 1;
      last = now;
      for (const s of ['a','b']) for (let i = 0; i < 3; i++) cur[s][i] += (tgt[s][i] - cur[s][i]) * k;
      cur.amt += (tgt.amt - cur.amt) * k;
      gl.uniform1f(uTime, frozen ?? (now - t0) / 1000 * .55);
      gl.uniform1f(uScroll, scrollY / Math.max(1, innerHeight));
      gl.uniform3fv(uA, cur.a); gl.uniform3fv(uB, cur.b); gl.uniform1f(uAmt, cur.amt);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      cv.classList.add('ready');
    }
    if (!reduceMotion || settling) raf = requestAnimationFrame(frame);
  }
  const kick = () => { if (!raf) raf = requestAnimationFrame(frame); };
  size(); kick();
  addEventListener('resize', () => { size(); kick(); });
  document.addEventListener('visibilitychange', kick);
  if (reduceMotion) addEventListener('scroll', kick, {passive:true});
  return {set(left, right, amt){ tgt.a = rgb(left); tgt.b = rgb(right); tgt.amt = amt; kick(); }};
})();

// which perfume is in the middle of the screen? (left & right columns separately)
let sheetOpen = false, bagOpen = false, cur = null, tintT = 0;
function pickTint(x, y){
  const shop = $('#shop').getBoundingClientRect();
  if (shop.top < y && shop.bottom > y){
    let best = null, bd = 1e9;
    document.querySelectorAll('.card:not([hidden])').forEach(c => {
      const r = c.getBoundingClientRect();
      if (x < r.left - 6 || x > r.right + 6) return;
      const d = Math.abs((r.top + r.bottom) / 2 - y);
      if (d < bd && d < r.height){ bd = d; best = c; }
    });
    if (best) return [byId(best.dataset.id).tint, 1];
  }
  for (const s of document.querySelectorAll('[data-tint]')){
    const r = s.getBoundingClientRect();
    if (r.top <= y && r.bottom >= y) return TINTS[s.dataset.tint];
  }
  return TINTS.brand;
}
function updateTint(){
  clearTimeout(tintT); tintT = 0;
  if (sheetOpen && cur){ Silk.set(cur.tint, cur.tint, 1); return; }
  const y = innerHeight * .55, l = pickTint(innerWidth * .25, y), r = pickTint(innerWidth * .75, y);
  Silk.set(l[0], r[0], Math.max(l[1], r[1]));
}
addEventListener('scroll', () => { if (!tintT) tintT = setTimeout(updateTint, 120); }, {passive:true});

/* ================= WAX SEAL ================= */
let uid = 0;
function sealSVG(){
  const u = 's' + (++uid), pts = [], n = 28;
  for (let i = 0; i < n; i++){ const a = i / n * Math.PI * 2, r = 54 + Math.sin(i * 2.7) * 3 + Math.cos(i * 1.3) * 2.2; pts.push([60 + Math.cos(a) * r, 60 + Math.sin(a) * r]); }
  let d = `M${((pts[0][0] + pts[n-1][0]) / 2).toFixed(1)} ${((pts[0][1] + pts[n-1][1]) / 2).toFixed(1)}`;
  for (let i = 0; i < n; i++){ const a = pts[i], b = pts[(i + 1) % n]; d += ` Q${a[0].toFixed(1)} ${a[1].toFixed(1)} ${((a[0] + b[0]) / 2).toFixed(1)} ${((a[1] + b[1]) / 2).toFixed(1)}`; }
  return `<svg viewBox="0 0 120 120"><defs>
    <radialGradient id="${u}w" cx="38%" cy="32%" r="75%"><stop offset="0" stop-color="#F8E4D6"/><stop offset=".4" stop-color="#D7A692"/><stop offset=".85" stop-color="#8E5A4A"/><stop offset="1" stop-color="#6A3E32"/></radialGradient>
    <radialGradient id="${u}i" cx="60%" cy="65%" r="70%"><stop offset="0" stop-color="#E6BBA8"/><stop offset="1" stop-color="#A56D5B"/></radialGradient></defs>
    <path d="${d}Z" fill="url(#${u}w)"/>
    <circle cx="60" cy="60" r="40" fill="url(#${u}i)" stroke="#7A4A3C" stroke-opacity=".5"/>
    <circle cx="60" cy="60" r="35" fill="none" stroke="#F8E4D6" stroke-opacity=".55" stroke-width=".8" stroke-dasharray="1.5 2.5"/>
    <text x="60" y="68" text-anchor="middle" font-family="Marcellus, serif" font-size="26" fill="#5A2E24" fill-opacity=".75">SL</text>
    <text x="60" y="82" text-anchor="middle" font-family="Marcellus, serif" font-size="5.5" letter-spacing="1.8" fill="#5A2E24" fill-opacity=".6">BY MUSTAFA</text></svg>`;
}
function stamp(host){
  const s = document.createElement('div'); s.className = 'seal-drop'; s.innerHTML = sealSVG();
  host.append(s); setTimeout(() => s.remove(), 2000);
}

/* ================= PRODUCT SHEET ================= */
const sheet = $('#sheet'), sheetScrim = $('#sheetScrim'), range = $('#ddRange');
let ddAnim = 0;
const LAYERS = ['top','heart','base'];
function curve(p, x){
  const Lg = p.long;
  return {
    top: Math.exp(-x / .6),
    heart: (.2 + .8 * (1 - Math.exp(-x / .4))) * Math.exp(-Math.pow(x / (Lg * .5), 2)),
    base: (.1 + .9 * (1 - Math.exp(-x / 1.8))) * Math.exp(-Math.pow(x / Lg, 4)),
  };
}
const state = v => t(v > .66 ? 'dd.s3' : v > .33 ? 'dd.s2' : v > .08 ? 'dd.s1' : 'dd.s0');
function timeLabel(x){
  if (x < .05) return `<b>0</b>${t('dd.t0')}`;
  if (x < 1) return `<b>${Math.max(1, Math.round(x * 60))}</b>${t('dd.min')}`;
  const h = Math.round(x * 2) / 2;
  return `<b>${h}</b>${t(h === 1 ? 'dd.h1' : 'dd.hN')}`;
}
function renderDD(){
  const p = cur, x = +range.value, c = curve(p, x);
  range.style.setProperty('--fill', (x / 12 * 100) + '%');
  $('#ddTime').innerHTML = timeLabel(x);
  LAYERS.forEach(k => {
    const row = document.querySelector(`[data-row="${k}"]`);
    row.style.opacity = (.35 + .65 * Math.min(1, c[k] * 1.2)).toFixed(2);
    row.querySelector('i').style.width = (c[k] * 100) + '%';
    row.querySelector('[data-state]').textContent = state(c[k]);
  });
  const R = {top:10 + 20 * c.top, heart:8 + 16 * c.heart, base:6 + 12 * c.base};
  LAYERS.forEach(k => { const el = document.querySelector(`[data-ring="${k}"]`); el.setAttribute('r', R[k].toFixed(1)); el.setAttribute('opacity', Math.min(1, c[k] * 1.3).toFixed(2)); });
}
function playDD(to){
  cancelAnimationFrame(ddAnim);
  if (reduceMotion){ range.value = to; renderDD(); return; }
  const t0 = performance.now(), from = +range.value, dur = 2200;
  const step = now => { const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3); range.value = from + (to - from) * e; renderDD(); if (k < 1) ddAnim = requestAnimationFrame(step); };
  ddAnim = requestAnimationFrame(step);
}
range.addEventListener('input', () => { cancelAnimationFrame(ddAnim); renderDD(); });

function fillSheet(){
  const p = cur, l = L(p);
  $('#shImg').src = img(p); $('#shImg').alt = `${p.house} ${p.name}`;
  $('#shHouse').textContent = p.house; $('#shName').textContent = p.name;
  $('#shMeta').innerHTML = `<bdi>${p.conc}</bdi> · <bdi>${p.size} ${t('unit')}</bdi> · ${p.moods.map(m => t('mood.' + m)).join(' / ')}`;
  $('#shDesc').textContent = l.desc;
  $('#shAdd').textContent = t('sheet.add') + money(p.price);
  $('#shWa').href = waLink(t('wa.product', `${p.house} ${p.name}`));
  $('#ddAura').innerHTML = LAYERS.map((k, i) => `<circle data-ring="${k}" cx="32" cy="32" r="10" fill="${p.aura[i]}" fill-opacity="${[.18,.3,.55][i]}" stroke="${p.aura[i]}" stroke-opacity=".6" stroke-width=".8"/>`).join('') + '<circle cx="32" cy="32" r="2.4" fill="#FFF4EC"/>';
  $('#ddRows').innerHTML = LAYERS.map((k, i) => `<div class="dd-row" data-row="${k}" style="--c:${p.aura[i]}">
    <div class="dd-row-head"><b>${t('dd.' + k)}</b><span data-state></span></div>
    <div class="meter"><i></i></div>
    <div class="notes">${l[k].map(n => `<span>${n}</span>`).join('')}</div></div>`).join('');
  renderDD();
}
function openSheet(id){
  cur = byId(id);
  range.value = 0; fillSheet();
  $('#sheetBody').scrollTop = 0;
  sheet.classList.add('open'); sheetScrim.classList.add('open'); sheet.setAttribute('aria-hidden','false');
  document.body.classList.add('locked'); sheetOpen = true; renderBag(); updateTint();
  history.pushState({sheet:1}, '');
  if (kb) setTimeout(() => $('#sheetClose').focus({preventScroll:true}), 50);
  setTimeout(() => playDD(3), 550);
}
function closeSheet(fromPop){
  if (!sheetOpen) return;
  if (!fromPop && history.state && history.state.sheet){ history.back(); return; }
  cancelAnimationFrame(ddAnim);
  sheet.classList.remove('open'); sheetScrim.classList.remove('open'); sheet.setAttribute('aria-hidden','true');
  sheet.style.transform = '';
  sheetOpen = false; if (!bagOpen) document.body.classList.remove('locked');
  renderBag(); updateTint();
  const back = document.querySelector(`[data-open="${cur.id}"]`); if (kb && back) back.focus({preventScroll:true});
}
$('#sheetClose').addEventListener('click', () => closeSheet());
sheetScrim.addEventListener('click', () => closeSheet());

// swipe the sheet down to close (phones)
(() => {
  let y0 = null, dy = 0;
  const grip = $('#grip'), body = $('#sheetBody');
  const start = y => { if (innerWidth >= 900) return; y0 = y; dy = 0; sheet.classList.add('dragging'); };
  const move = y => { if (y0 == null) return; dy = Math.max(0, y - y0); sheet.style.transform = `translateY(${dy}px)`; };
  const end = () => { if (y0 == null) return; sheet.classList.remove('dragging'); y0 = null; if (dy > 110) closeSheet(); else sheet.style.transform = ''; };
  grip.addEventListener('pointerdown', e => start(e.clientY));
  addEventListener('pointermove', e => move(e.clientY)); addEventListener('pointerup', end);
  body.addEventListener('touchstart', e => { if (body.scrollTop <= 0) start(e.touches[0].clientY); }, {passive:true});
  body.addEventListener('touchmove', e => { if (y0 == null) return; if (body.scrollTop > 0){ y0 = e.touches[0].clientY; return; } move(e.touches[0].clientY); }, {passive:true});
  body.addEventListener('touchend', end);
})();

  $('#checkout').href = waLink(`${t('wa.order')}\n${lines.join('\n')}\n${t('wa.total')}: ${money(total)}`);
}
$('#bagItems').addEventListener('click', e => {
  const b = e.target.closest('[data-q]');
  if (b){ const it = bag[+b.dataset.q]; it.qty += +b.dataset.d; if (it.qty <= 0) bag.splice(+b.dataset.q, 1); save(); renderBag(); }
  if (e.target.closest('[data-close]')) closeBag();
});
function openBag(){
  if (sheetOpen){ sheet.classList.remove('open'); sheetScrim.classList.remove('open'); sheet.setAttribute('aria-hidden','true'); sheetOpen = false; updateTint(); }
  $('#drawer').classList.add('open'); $('#bagScrim').classList.add('open'); $('#drawer').setAttribute('aria-hidden','false');
  document.body.classList.add('locked'); bagOpen = true; renderBag();
  if (!(history.state && history.state.sheet)) history.pushState({bag:1}, ''); else history.replaceState({bag:1}, '');
  if (kb) setTimeout(() => $('#closeBag').focus({preventScroll:true}), 50);
}
function closeBag(fromPop){
  if (!bagOpen) return;
  if (!fromPop && history.state && history.state.bag){ history.back(); return; }
  $('#drawer').classList.remove('open'); $('#bagScrim').classList.remove('open'); $('#drawer').setAttribute('aria-hidden','true');
  bagOpen = false; if (!sheetOpen) document.body.classList.remove('locked'); renderBag();
}
addEventListener('popstate', () => { if (sheetOpen) closeSheet(true); if (bagOpen) closeBag(true); });
$('#bagBtn').addEventListener('click', openBag);
$('#bagPill').addEventListener('click', openBag);
$('#closeBag').addEventListener('click', () => closeBag());
$('#bagScrim').addEventListener('click', () => closeBag());
addEventListener('keydown', e => { if (e.key === 'Escape'){ if (bagOpen) closeBag(); else if (sheetOpen) closeSheet(); } });
let tt;
function toast(text){ const el = $('#toast'); el.textContent = text; el.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => el.classList.remove('show'), 2200); }

/* ================= LANGUAGE ================= */
function applyLang(l){
  lang = l;
  const root = document.documentElement; root.lang = l; root.dir = 'rtl';
  document.title = t('meta.title');
  document.querySelector('meta[name="description"]').content = t('meta.desc');
  document.querySelectorAll('[data-t]').forEach(el => el.textContent = t(el.dataset.t));
  document.querySelectorAll('[data-t-aria]').forEach(el => el.setAttribute('aria-label', t(el.dataset.tAria)));
  document.querySelectorAll('[data-t-alt]').forEach(el => el.alt = t(el.dataset.tAlt));
  document.querySelectorAll('[data-wa]').forEach(a => a.href = waLink(t(a.dataset.wa)));
  const lb = $('#langBtn'); lb.textContent = t('lang.other'); lb.lang = t('lang.otherCode'); lb.setAttribute('aria-label', t('lang.aria'));
  $('#housesText').textContent = t('houses.sr') + HOUSES.join(', ');
  renderGrid(); renderBag();
  if (sheetOpen) fillSheet();
  try { localStorage.setItem('sl-lang', l); } catch(_){}
  const u = new URL(location.href); if (l === 'he') u.searchParams.delete('lang'); else u.searchParams.set('lang', l);
  history.replaceState(history.state, '', u);
}
$('#langBtn').addEventListener('click', () => {
  const next = lang === 'he' ? 'ar' : 'he';
  if (document.startViewTransition && !reduceMotion) document.startViewTransition(() => applyLang(next)); else applyLang(next);
});
let startLang = new URLSearchParams(location.search).get('lang');
if (!T[startLang]) { try { startLang = localStorage.getItem('sl-lang'); } catch(_){} }
applyLang(T[startLang] ? startLang : 'he');
observeCards();
updateTint();
})();
</script>
